name: Publish site

# Builds reelwatch.stream on every push, and every 30 minutes so new and updated profile previews show up.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the site with profile previews
        run: node .build/cards.mjs
        env:
          REEL_CARDS_TOKEN: ${{ secrets.REEL_CARDS_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded site to be available
        uses: actions/github-script@v8
        with:
          script: |
            for (let attempt = 0; attempt < 8; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) return;
              core.info('Waiting for GitHub to index the site artifact...');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The site uploaded, but GitHub did not make the artifact available. Re-run this deployment.');
      - id: deployment
        uses: actions/deploy-pages@v5
