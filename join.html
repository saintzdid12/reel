<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch party invite on Reel</title>
<meta name="description" content="You’re invited to a Reel watch party.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="reelwatch.stream">
<meta property="og:title" content="You’re invited to a watch party on Reel">
<meta property="og:description" content="Join from the Reel app or right in your browser. Playback stays in sync for everyone, with chat and reactions.">
<meta property="og:image" content="https://reelwatch.stream/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" media="print" onload="this.media='all'">
<style>
  :root { color-scheme: dark; --text: #f5f5f7; --text-2: rgba(235,235,245,.68); --text-3: rgba(235,235,245,.46); --spring: cubic-bezier(.2,.9,.25,1.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--text); }
  body { font: 16px/1.6 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  [hidden] { display: none !important; }
  main { width: 100%; max-width: 476px; margin: clamp(24px, 10vh, 120px) auto 60px; padding: 0 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; text-decoration: none; color: inherit; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  h1 { margin: 0 0 8px; font-size: clamp(32px, 8vw, 44px); line-height: 1.05; letter-spacing: -.04em; }
  p { margin: 0; color: var(--text-2); }
  .code { margin: 22px 0 26px; font-size: 40px; font-weight: 800; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
  .code small { display: block; font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--text-3); }
  .acts { display: grid; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; font-weight: 600; font-size: 15.5px; text-decoration: none; transition: transform .3s var(--spring); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: rgba(255,255,255,.95); color: #000; }
  .btn.glass { color: var(--text); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .fine { margin-top: 20px; font-size: 13.5px; color: var(--text-3); }
  .fine a { color: var(--text-2); }
</style>
</head>
<body>
<script src="/header.js"></script>
<main>
  <h1>You’re invited to a watch party</h1>
  <p>Everyone’s playback stays in sync, with chat and reactions.</p>
  <div class="code" id="code"><small>Party code</small><span></span></div>
  <div class="acts">
    <a class="btn primary" id="app" href="#">Open in Reel</a>
    <a class="btn glass" id="web" href="/watch/">Join in your browser</a>
  </div>
  <div class="fine" id="fine">Open in Reel needs the Reel app on this computer. <a href="/download/">Get Reel</a>. To watch you’ll need a Reel account and a debrid service.</div>
</main>
<script>
  const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  document.querySelector('#code span').textContent = code || 'Missing';
  const phone = /Android|iPhone|iPad|iPod|Mobile|AFT|Android TV/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform || ''));
  const app = document.getElementById('app'), web = document.getElementById('web');
  if (code) {
    app.href = `reel://party/${code}`;
    web.href = `/watch/?party=${code}`;
  }
  // Phones and TVs join in the browser (the TV app takes the code under Watch party).
  if (phone) {
    app.hidden = true;
    web.className = 'btn primary';
    document.getElementById('fine').innerHTML = 'On a TV, open Reel and enter the code to join. To watch you’ll need a Reel account and a debrid service.';
  }
</script>
<script src="/count.js" data-page="join"></script>
</body>
</html>
