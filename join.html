<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a Reel watch party</title>
<meta name="description" content="You're invited to a Reel watch party.">
<meta property="og:title" content="Join my Reel watch party">
<meta property="og:description" content="Open Reel and join — everyone stays in sync.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #050505; --fg: #fff; --dim: rgba(255,255,255,.62); --edge: rgba(255,255,255,.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 Inter, "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(70% 60% at 50% 0%, rgba(88,101,242,.22), transparent 70%), var(--bg); }
  .card { width: 100%; max-width: 420px; text-align: center; padding: 36px 28px; border-radius: 28px; background: rgba(255,255,255,.05); border: 1px solid var(--edge); }
  .logo { width: 64px; height: 64px; border-radius: 18px; }
  h1 { margin: 14px 0 4px; font-size: 26px; letter-spacing: -.02em; }
  p { margin: 0 0 18px; color: var(--dim); }
  .code { display: inline-block; margin: 6px 0 22px; padding: 10px 20px; border-radius: 14px; font-size: 30px; font-weight: 800; letter-spacing: .2em; background: rgba(255,255,255,.07); border: 1px solid var(--edge); }
  .btn { display: flex; justify-content: center; padding: 14px 20px; border-radius: 999px; background: #5865f2; color: #fff; font-weight: 700; text-decoration: none; }
  .btn.alt { margin-top: 10px; background: rgba(255,255,255,.08); }
  .fine { margin-top: 18px; font-size: 12.5px; color: var(--dim); }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon.png" alt="">
  <h1>You’re invited to watch together</h1>
  <p>Open Reel to join — playback stays in sync for everyone.</p>
  <div class="code" id="code">——</div>
  <a class="btn" id="open" href="#">Open in Reel</a>
  <a class="btn alt" href="./">Don’t have Reel? Download it</a>
  <div class="fine">In Reel you can also go to <b>Friends → Join</b> and type the code.</div>
</div>
<script>
  const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
  document.getElementById('code').textContent = code || '——';
  const link = code ? `reel://party/${code}` : '#';
  document.getElementById('open').href = link;
  if (code) setTimeout(() => { location.href = link; }, 400);
</script>
</body>
</html>
