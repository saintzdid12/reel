<body class="web">
  <div id="launch"><div class="ln-glow"></div><div class="ln-mark"><img src="icon.png" alt=""><span>Reel</span></div></div>

      <button data-go="discover">For You</button>

    <div class="nav-cluster">
      <span class="clock" id="clock"></span>
      <button class="icon-btn" data-go="search" title="Search (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>

        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3.3 0-7 1.6-7 4v3h14v-3c0-2.4-3.7-4-7-4zm8 0c-.5 0-1 0-1.6.1 1.1.9 1.6 2.1 1.6 3.4V20h6v-3c0-2.4-3.3-4-6-4z"/></svg>
      </button>
      <button class="icon-btn" data-go="settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>
  <div id="ambient"><div class="amb"></div><div class="amb"></div></div>
  <main id="view"></main>
  <div id="modal-root"></div>
  <div id="player-root"></div>
  <div id="toast"></div>

  <script src="web-keys.js"></script>
